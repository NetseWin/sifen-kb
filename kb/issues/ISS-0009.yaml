id: ISS-0009
kind: ambiguity
affects:
  - subject: field:DE:D208
  - subject: field:DE:D210
  - subject: field:DE:F023
statement: |-
  Las NT no declaran la leyenda de colores del MT, pero en varias el texto resaltado en rojo dentro de una fila «modificada» marca texto eliminado (como en la leyenda del MT): (1) NT 2, campos D208 y D210: «No informar si D201 = 1 o D202=4» en rojo, en la misma NT que elimina D208d (1322) y D210a (1323), las validaciones que imponían ese «no informar»; con la celda completa, la versión de NT 2 sería idéntica a la del MT. (2) NT 8, campo F023: «Cuando C002=4 corresponde a F014» en rojo, con el encabezado «se modifican y eliminan las fórmulas» y el Histórico «se elimina la diferencia que cuenta con relación a la Autofactura campo F023»; con la celda completa, la versión de NT 8 sería idéntica a la del MT. (3) NT 23, campos D208 y D210: «y D202 ≠ 4» en rojo y «No informar si D201 = 1» como texto agregado, con la cita del Art. 6° (Numeral 1) del Decreto 872/2023 (identificación obligatoria en B2B, B2F o B2G). Con el rojo como eliminación, la observación vigente de D208 y D210 desde NT 23 es «Obligatorio si D201 = 2 No informar si D201 = 1 …».
evidence:
