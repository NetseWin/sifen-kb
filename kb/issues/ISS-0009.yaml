id: ISS-0009
kind: ambiguity
affects:
  - subject: field:DE:D208
  - subject: field:DE:D210
  - subject: field:DE:F023
statement: |-
  En varias NT el texto resaltado en rojo dentro de una fila «modificada» parece marcar texto eliminado (como en la leyenda del MT), pero la KB copia la celda completa porque en NT 21 y NT 24 el rojo se trató como texto vigente: (1) NT 2, campos D208 y D210: «No informar si D201 = 1 o D202=4» en rojo, en la misma NT que elimina D208d (1322) y D210a (1323), las validaciones que imponían ese «no informar»; con la celda completa, la versión de NT 2 es idéntica a la del MT. (2) NT 8, campo F023: «Cuando C002=4 corresponde a F014» en rojo, con el encabezado «se modifican y eliminan las fórmulas» y el Histórico «se elimina la diferencia que cuenta con relación a la Autofactura campo F023»; con la celda completa, la versión de NT 8 es idéntica a la del MT. (3) NT 23, campos D208 y D210: «y D202 ≠ 4» en rojo y «No informar si D201 = 1» como texto agregado, con la cita del Art. 6° (Numeral 1) del Decreto 872/2023 (identificación obligatoria en B2B, B2F o B2G). Si el rojo fuera eliminación, la observación vigente de D208 y D210 desde NT 23 sería «Obligatorio si D201 = 2 No informar si D201 = 1 …».
evidence:
  - raw:NT_002@6aaf4a8f4797:p1:D208#observations
  - raw:NT_002@6aaf4a8f4797:p1:D210#observations
  - raw:NT_008@2b1c2f0b25e9:p1:F023#observations
  - raw:NT_023@9cb063673358:p1:D208#observations
  - raw:NT_023@9cb063673358:p1:D210#observations
blocking: false
policy: |-
  Decisión del usuario (2026-10-17): en las NT el rojo es contenido eliminado (verde agregado, amarillo modificado), aplicado junto con el verbo del encabezado y el contexto; si las señales se contradicen, Issue bloqueante. Se implementará separando rendered_literal (celda completa, con su marcado) de effective_literal (derivado de forma determinista), un cambio de código (rawio/draft/integrity) y de diseño fuera de este PR de conocimiento; extraction/fixes.yaml no se usa para esto. Hasta entonces las versiones de NT 2 (D208, D210), NT 8 (F023) y NT 23 (D208, D210) conservan la celda completa y la duda en open_questions; al implementarse, se re-materializan con sifen draft y este Issue se revisa.
status: open
