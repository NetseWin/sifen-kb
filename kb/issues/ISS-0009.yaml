blocking: false
policy: |-
  Decisión del usuario (2026-10-17): en las NT el rojo es contenido eliminado (verde agregado, amarillo modificado), aplicado junto con el verbo del encabezado y el contexto; si las señales se contradicen, Issue bloqueante. Implementado separando rendered_literal (celda completa, con su marcado) de effective_literal (derivado de forma determinista; código en la rama feat/literal-efectivo, commit 0685ce4); extraction/fixes.yaml no se usa para esto. Las versiones de NT 2 (D208, D210), NT 8 (F023) y NT 23 (D208, D210) se re-materializaron con sifen draft desde el literal efectivo. El Issue queda abierto, no bloqueante, solo como trazabilidad: la lectura del color es una decisión de curación, no una leyenda declarada en las NT; una respuesta oficial de DNIT en contrario se registra aquí.
status: open
