versions:
  - introduced_by: baseline
    code: 1314
    severity: R
    message: Es obligatorio informar el número de documento de identidad del receptor
    observation: |-
      Si la naturaleza del receptor es NO contribuyente (D201=2) y el tipo de operación es diferente a B2F (D202≠4), el número de documento de identidad debe ser informado
    condition:
      expr: D201 == 2 and D202 != 4 and not exists(D210)
      level: full
      interpretation:
        by: llm
        run: a067d55b-d757-498d-a601-f946db1a3acc
        note: |-
          Se viola cuando el receptor es no contribuyente, la operación no es B2F y D210 no se informa. D201 y D202 son obligatorios (1-1): se leen sin guarda.
    evidence:
      - raw:MT_V150@976cd88c05c3:p168:D210
  - introduced_by:
      - NT_023#4
    based_on: baseline
    code: 1314
    severity: R
    message: Es obligatorio informar el número de documento de identidad del receptor
    observation: |-
      Si la naturaleza del receptor es NO contribuyente (D201=2) , el número de documento de identidad debe ser informado
    condition:
      expr: D201 == 2 and not exists(D210)
      level: full
      interpretation:
        by: llm
        run: ce4ca541-bb4f-49d4-8e9f-5430b10e6d63
        note: |-
          Se viola cuando el receptor es no contribuyente y D210 no se informa, también en operaciones B2F: NT 23 quita en rojo «y el tipo de operación es diferente a B2F (D202≠4)» (rojo = contenido eliminado, decisión del usuario 2026-10-17; ISS-0010 resuelto). D201 es obligatorio (1-1): se lee sin guarda. El espacio antes de la coma que deja el tramo quitado se conserva en el literal (decisión del usuario 11).
    evidence:
      - raw:NT_023@9cb063673358:p2:D210
