    evidence:
      - raw:NT_023@9cb063673358:p1:D208
    open_questions:
      - |-
        NT 23 resalta en rojo «y D202 ≠ 4» de «Obligatorio si D201 = 2 y D202 ≠ 4» y cita el Art. 6° (Numeral 1) del Decreto 872/2023 (identificación obligatoria en B2B, B2F o B2G). Si el rojo indicara eliminación, D208 sería obligatorio para todo receptor no contribuyente, como dice D208g (1335). La KB copia la celda completa (ISS-0009, ISS-0003).
