  - id: NT_010#6
    verb_literal: se modifican y elimina las siguientes validaciones y se agrega nueva validación
    action: remove
    target: val:DE:D208b
    declared_scope: row
    evidence:
      - raw:NT_010@d261165c512c:p3:D208b
    interpretation:
      by: llm
      run: a067d55b-d757-498d-a601-f946db1a3acc
      note: |-
        El encabezado de §2.1 combina tres verbos para cuatro filas sin decir cuál corresponde a cada una: «se modifican» (plural), «elimina» (una eliminación) y «se agrega nueva validación» (una alta). Por exclusión: D208e (1331) es la nueva (no existe en el MT); D202 (1300) y D220 (1325) traen texto distinto del MT (modificadas); D208b (1319) se reproduce idéntica a la fila del MT, por lo que no hay modificación que aplicar y es la única candidata a «elimina». El resaltado rojo de toda la fila en el PDF coincide, pero el color no fundamenta la acción. Interpretación propia, sujeta a revisión: ISS-0008. Contradice el supuesto del diseño (§G.3, §S) de que D208b rige hasta NT 23.
