      note: |-
        La NT reproduce la fila completa; cambia la Observación: umbral 60.000.000 → 35.000.000, se eliminan en rojo «Si el Tipo de transacción es distinto a Muestras médicas (D011≠13),», «o igual» y el «=» de los dos «>=» (rojo = contenido eliminado, decisión del usuario 2026-10-17) y la «E» de «El Tipo» pasa a mayúscula (amarillo = modificado), donde empieza la oración al quitar la cláusula previa. Regla efectiva: «mayor a» 35.000.000, sin la excepción D011 = 13 (ISS-0011, trazabilidad). La revisión registrada (re-subida del 2024-12-30) lleva la marca de agua «VER NOTA TÉCNICA N° 24 DESDE EL 01/01/2025», que es gráfica: no está en el texto del PDF ni en raw/, por eso la ficha no declara superseded_by (su cita no sería verificable). El fin de esta versión (2025-01-01) se deriva del inicio de NT_024#1 y lo fija la fila golden «watermark».
