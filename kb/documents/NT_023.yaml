      note: |-
        Cambia la Observación: se elimina «y D202 ≠ 4» (en rojo; rojo = contenido eliminado, decisión del usuario 2026-10-17) y se agrega «No informar si D201 = 1», con la cita del Art. 6° (Numeral 1) del Decreto 872/2023. La lista de valores (incluido «6=Tarjeta Diplomática de exoneración fiscal») ya estaba en el MT V150 y en NT 2: NT 23 no agrega el valor 6. Literal efectivo; ISS-0009 queda como trazabilidad.
