    interpretation:
      by: llm
      run: ce4ca541-bb4f-49d4-8e9f-5430b10e6d63
      note: |-
        La fila reproduce la del MT V150 con el tramo «y el tipo de operación es diferente a B2F (D202≠4)» en rojo, que se elimina (rojo = contenido eliminado, decisión del usuario 2026-10-17): el «se modifica» consiste en quitar la excepción B2F. Desde NT 23, 1314 exige D210 para todo receptor no contribuyente (D201 = 2), paralelo a D208g (1335). ISS-0010 resuelto (decisión 4).
  - id: NT_023#5
    verb_literal: se modifica la siguiente validación
    action: add
    target: val:DE:D208f
    declared_scope: row
    evidence:
      - raw:NT_023@9cb063673358:p2:D208f
    interpretation:
      by: llm
      run: ce4ca541-bb4f-49d4-8e9f-5430b10e6d63
      note: |-
        El encabezado dice «se modifica», pero D208f (1333) no existe en el MT V150 ni en ninguna NT anterior y la fila está entera en verde (agregado): no hay predecesora que modificar, se modela como alta (color = acción, ≠ verbo literal: ISS-0014, trazabilidad). Mensaje y observación idénticos a los de D208b (1319), eliminada por NT 10 según NT_010#6: ISS-0002.
