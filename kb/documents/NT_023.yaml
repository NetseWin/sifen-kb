      run: a067d55b-d757-498d-a601-f946db1a3acc
      note: |-
        La fila reproducida es idéntica a la del MT V150: el «se modifica» no se refleja en el literal. En el PDF el tramo «y el tipo de operación es diferente a B2F (D202≠4)» está en rojo; si el rojo significara eliminación (leyenda del MT), 1314 exigiría D210 para todo receptor no contribuyente. Se copia la celda completa y se abre ISS-0010 (bloqueante sobre 1314 desde NT 23).
