# Golden temporal del escenario [HIP] de docs/arquitectura.md §G.5 sobre tests/fixtures/kb_hyp/.
# Lo ejecuta tests/test_golden_temporal.py. Formato (§K.5):
#   {key, at, env, kb?, processed_at?, verdicts?, expect}     resolución (o G.4 si hay processed_at)
#   {key, diff: [desde, hasta], expect}                        diff entre versiones (anti-R3)
# kb: hyp (por defecto) | hyp_rev2_pendiente | corte:AAAA-MM-DD (corte de la KB base de este archivo).
# expect: state, reasons (si falta: ninguno), introduced_by, kind, code, severity, interval_from,
#   interval_to, upcoming_includes, upcoming_excludes, upcoming_empty, warnings_includes,
#   open_issues_includes, pending_effects, history, verdict, emission_verdict, processing_verdict,
#   boundary, changed, within_declared_scope. Una clave desconocida hace fallar la fila.
# Completitud (§K.5): cada frontera tiene una fila el día anterior y otra el día del cambio, en cada
# ambiente donde las fechas difieran (lo verifica test_golden_hyp_completeness).
# Las filas G5-n reproducen la fila n de la tabla de G.5 en su versión [HIP].

