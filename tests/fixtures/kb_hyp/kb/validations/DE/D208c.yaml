subject_field: field:DE:D208
versions:
  - introduced_by: baseline
    code: 1321
    severity: R
    message: |-
      Tipo de documento de identidad del receptor incorrecto para el total general de la operación en guaraníes
    observation: |-
      Si el Tipo de transacción es distinto a Muestras médicas (D011≠13), El Tipo de documento de identidad del receptor no puede ser Innominado (D208≠5) cuando el total general de la operación en guaraníes (cuando la moneda es extranjera) o el total general de la operación (cuando la moneda es PYG) es mayor o igual a 60.000.000 (F023 >= 60.000.000 o F014 >= 60.000.000)
    condition:
      expr: |-
        (not exists(D011) or D011 != 13) and exists(D208) and D208 == 5 and ((exists(F023) and F023 >= 60000000) or (exists(F014) and F014 >= 60000000))
      level: partial
      gaps: |-
        Sigue el paréntesis formal. La prosa asocia F023 a moneda extranjera y F014 a PYG (D015) (ISS-0002). Que D011 ausente equivalga a ≠ 13 y que D208 ausente no viole son interpretaciones.
      interpretation:
        by: human
        note: '[HIP] fixture'
    evidence:
      - raw:MT_V150@acb2499a93b3:p167:D208c
