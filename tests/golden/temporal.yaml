# Golden temporal de la KB REAL (docs/arquitectura.md §G.5 y §K.5). Lo ejecuta tests/test_golden_temporal.py.
# Formato: ver la cabecera de tests/fixtures/golden_hyp.yaml. kb: real (por defecto) | corte:AAAA-MM-DD.
# Completitud (§K.5): cada frontera de cada patrón temporal del piloto tiene una fila el día anterior y otra
# el día del cambio, en cada ambiente donde las fechas difieren (test_golden_real_completeness). Las ventanas
# de ISS-0002 (no bloqueante desde la decisión del 2026-10-17), ISS-0003 (bloqueante) e ISS-0010 (resuelto por la
# decisión 4 al re-materializar NT_023#4 con el literal efectivo) también tienen sus dos filas por ambiente.
# Las filas G5-n reproducen la fila n de la tabla de §G.5 sobre datos reales. Donde la evidencia de raw/
# contradice al diseño, manda la evidencia (ver el informe del PR): D208 ya trae el valor 6 en el MT V150
# (NT 23 no lo agrega) y D208b la elimina NT 10 (NT_010#6, ISS-0008, aceptado por el usuario).

